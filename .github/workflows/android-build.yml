name: Irfan al-Uloom Zakat Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 4. Initialize Preinstalled Android SDK
      - name: Initialize Android SDK
        shell: bash
        run: |
          set -e

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          test -d "$SDK_ROOT"

          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" \
            -type f -name sdkmanager | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER=$(command -v sdkmanager || true)
          fi

          test -n "$SDKMANAGER"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          echo "Android SDK initialized."
          echo "SDK Manager: $SDKMANAGER"

          printf '%s\n' "$SDKMANAGER" > /tmp/sdkmanager-path.txt

      # 5. Accept Licenses and Install SDK
      - name: Install Android SDK 36
        shell: bash
        run: |
          set -e

          SDKMANAGER=$(cat /tmp/sdkmanager-path.txt)
          SDK_ROOT="$ANDROID_HOME"

          set +e
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses
          LICENSE_STATUS=${PIPESTATUS[1]}
          set -e

          if [ "$LICENSE_STATUS" -ne 0 ]; then
            echo "Android SDK license acceptance failed."
            exit 1
          fi

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --list_installed

          test -d "$SDK_ROOT/platforms/android-36"
          test -d "$SDK_ROOT/build-tools/36.0.0"

          echo "ANDROID SDK 36 VERIFIED"

      # 6. Extract Source ZIP
      - name: Extract Updated Source ZIP
        run: |
          set -e

          mkdir extracted

          unzip -q Irfan-Al-Uloom-Zakat-Updated-Source-v1.3.0.zip -d extracted

          ROOT_DIR=$(find extracted -mindepth 1 -maxdepth 1 -type d | head -n 1)

          test -n "$ROOT_DIR"

          cp -a "$ROOT_DIR"/. .

          test -f package.json
          test -f capacitor.config.json
          test -f www/index.html

      # 7. Verify Icon
      - name: Verify App Icon
        run: |
          set -e

          test -f icons/icon-512.png

          mkdir -p assets

          cp icons/icon-512.png assets/icon.png

      # 8. Install Dependencies
      - name: Install Dependencies
        run: npm install

      # 9. Build Web Assets
      - name: Build Web Assets
        run: npm run build

      # 10. Add Android
      - name: Add Android Platform
        run: npx cap add android

      # 11. Generate Icons
      - name: Generate Android App Icons
        run: |
          npm install --no-save @capacitor/assets

          npx capacitor-assets generate --android

      # 12. Sync Android
      - name: Sync Android
        run: npx cap sync android

      # 13. AdMob
      - name: Configure AdMob
        run: npm run android:admob

      # 14. SDK and Version Configuration
      - name: Enforce Android SDK and Version
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re

          variables = Path("android/variables.gradle")
          app = Path("android/app/build.gradle")

          if not variables.exists():
              raise SystemExit("variables.gradle not found")

          if not app.exists():
              raise SystemExit("app/build.gradle not found")

          s = variables.read_text()

          settings = {
              "minSdkVersion": 24,
              "compileSdkVersion": 36,
              "targetSdkVersion": 36,
          }

          for key, value in settings.items():
              pattern = rf'(\b{key}\s*=\s*)\d+'

              s, count = re.subn(
                  pattern,
                  rf'\g<1>{value}',
                  s
              )

              if count == 0:
                  raise SystemExit(f"{key} not found in variables.gradle")

          variables.write_text(s)

          s = app.read_text()

          if not re.search(r'\bdefaultConfig\s*\{', s):
              raise SystemExit("defaultConfig block not found")

          s, count = re.subn(
              r'(\bversionCode\s+)\d+',
              r'\g<1>2',
              s,
              count=1
          )

          if count == 0:
              raise SystemExit("versionCode not found")

          app.write_text(s)

          print("MIN SDK = 24")
          print("COMPILE SDK = 36")
          print("TARGET SDK = 36")
          print("VERSION CODE = 2")
          PY

          echo "===== SDK CONFIGURATION ====="
          cat android/variables.gradle

          echo "===== VERSION CODE ====="
          grep -n "versionCode" android/app/build.gradle

      # 15. Restore Original Keystore
      - name: Restore Original Signing Key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          test -n "$KEYSTORE_BASE64"

          mkdir -p android/app

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode \
            > android/app/signing.keystore

          test -s android/app/signing.keystore

          chmod 600 android/app/signing.keystore

          echo "ORIGINAL KEYSTORE RESTORED"

      # 16. Configure Release Signing
      - name: Configure Release Signing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle")

          if not p.exists():
              raise SystemExit("build.gradle not found")

          s = p.read_text()

          if "signingConfigs {" in s:
              raise SystemExit("Existing signingConfigs found")

          android = re.search(r'\bandroid\s*\{', s)

          if not android:
              raise SystemExit("Android block not found")

          signing = """
              signingConfigs {
                  release {
                      storeFile file("signing.keystore")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
          """

          s = s[:android.end()] + "\n" + signing + s[android.end():]

          build_types = re.search(r'\bbuildTypes\s*\{', s)

          if not build_types:
              raise SystemExit("buildTypes block not found")

          release = re.search(
              r'\brelease\s*\{',
              s[build_types.end():]
          )

          if not release:
              raise SystemExit("Release block not found")

          start = build_types.end() + release.end() - 1

          depth = 0
          end = None

          for i in range(start, len(s)):
              if s[i] == '{':
                  depth += 1
              elif s[i] == '}':
                  depth -= 1

                  if depth == 0:
                      end = i
                      break

          if end is None:
              raise SystemExit("Release block parsing failed")

          s = (
              s[:end]
              + "\n            signingConfig signingConfigs.release\n        "
              + s[end:]
          )

          p.write_text(s)

          print("RELEASE SIGNING CONFIGURED")
          PY

      # 17. Build Signed APK and AAB
      - name: Build Signed Android APK and AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          cd android

          chmod +x gradlew

          ./gradlew clean assembleRelease bundleRelease

      # 18. Verify Package, SDK and Signing
      - name: Verify Package Name and Signing
        shell: bash
        run: |
          set -e

          echo "===== CAPACITOR APP ID ====="
          cat capacitor.config.json

          echo "===== APPLICATION ID ====="
          grep -n "applicationId" android/app/build.gradle

          echo "===== SDK CONFIGURATION ====="
          cat android/variables.gradle

          echo "===== VERSION CODE ====="
          grep -n "versionCode" android/app/build.gradle

          AAB=$(find android/app/build/outputs/bundle/release \
            -name "*.aab" -print -quit)

          APK=$(find android/app/build/outputs/apk/release \
            -name "*.apk" -print -quit)

          test -n "$AAB"
          test -n "$APK"

          echo "===== VERIFY AAB SIGNATURE ====="
          jarsigner -verify -verbose -certs "$AAB"

          echo "===== VERIFY APK SIGNATURE ====="

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -name apksigner | sort -V | tail -n 1)

          test -n "$APKSIGNER"

          "$APKSIGNER" verify --verbose --print-certs "$APK"

          echo "===== VERIFY AAB SHA1 ====="

          keytool -printcert -jarfile "$AAB"

          ACTUAL_SHA1=$(keytool -printcert -jarfile "$AAB" \
            | awk -F': ' '/SHA1:/{print $2; exit}' \
            | tr -d '[:space:]' \
            | tr '[:lower:]' '[:upper:]')

          EXPECTED_SHA1="1C:F9:47:39:B1:55:F9:73:FD:44:85:4A:E6:2B:E9:2E:A2:DF:7D:13"

          if [ "$ACTUAL_SHA1" != "$EXPECTED_SHA1" ]; then
            echo "ERROR: SHA1 DOES NOT MATCH"
            exit 1
          fi

          echo "SUCCESS: ORIGINAL KEY VERIFIED"

      # 19. Upload Artifacts
      - name: Upload Signed APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: Irfan-Zakat-Signed-Android-Build
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
